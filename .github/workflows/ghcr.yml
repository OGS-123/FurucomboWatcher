name: Build and Publish Flash Executor Image

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag (overrides auto-tagging)'
        required: false
        type: string
      build_arch:
        description: 'Target architecture'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # --- Security Scan Job ---
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # --- Build and Push Job ---
  build-and-push:
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        executor: 
          - name: aave-flashloan
            file: Dockerfile.aave
          - name: balancer-flashswap
            file: Dockerfile.balancer
          - name: uniswap-flashswap
            file: Dockerfile.uniswap
          - name: protocolink-executor
            file: Dockerfile.protocolink
          - name: multi-protocol
            file: Dockerfile.multi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # --- Setup Docker Buildx for multi-architecture ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --debug

      # --- Log in to GitHub Container Registry ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Extract metadata (tags, labels) for Docker ---
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.executor.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.title=Flash Loan Executor - ${{ matrix.executor.name }}
            org.opencontainers.image.description=Ready-to-use flash loan/swap executor for DeFi arbitrage
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT
            com.github.actions.owner=${{ github.repository_owner }}
            com.github.actions.repository=${{ github.repository }}
            com.github.actions.executor-type=${{ matrix.executor.name }}
            com.github.actions.build-date=${{ github.event.repository.updated_at }}

      # --- Build and Push Multi-Architecture Image ---
      - name: Build and push ${{ matrix.executor.name }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ matrix.executor.file }}
          platforms: ${{ github.event.inputs.build_arch || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.executor.name }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.executor.name }}:buildcache
          cache-to: |
            type=gha,scope=${{ matrix.executor.name }},mode=max
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.executor.name }}:buildcache,mode=max
          provenance: true
          sbom: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            EXECUTOR_TYPE=${{ matrix.executor.name }}
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}

      # --- Generate OCI Image Attestations ---
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.executor.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # --- Test the built image (quick sanity check) ---
      - name: Test image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.executor.name }}:sha-${{ github.sha }} --help || echo "No help command available"

  # --- Compose Multi-Executor Image (all-in-one) ---
  build-composite:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push composite executor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.composite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Flash Loan/Flash Swap Executor Suite
            org.opencontainers.image.description=All-in-one executor for multiple flash loan/swap protocols
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}

  # --- Update GitHub Release Notes ---
  update-release:
    runs-on: ubuntu-latest
    needs: [build-composite]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          cat > release-notes.md << EOF
          ## 🚀 Flash Loan/Flash Swap Executor Images Released

          ### 📦 Available Images on GHCR

          | Executor | Image Name | Pull Command |
          |----------|------------|--------------|
          | Aave Flash Loan | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-aave-flashloan\` | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-aave-flashloan:latest\` |
          | Balancer Flash Swap | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-balancer-flashswap\` | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-balancer-flashswap:latest\` |
          | Uniswap Flash Swap | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-uniswap-flashswap\` | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-uniswap-flashswap:latest\` |
          | Protocolink Executor | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-protocolink-executor\` | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-protocolink-executor:latest\` |
          | Multi-Protocol | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |

          ### 🛠️ Usage Instructions

          1. **Pull the image**:
             \`\`\`bash
             docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
             \`\`\`

          2. **Run the executor**:
             \`\`\`bash
             docker run --rm \\
               -e RPC_URL="your_rpc_url" \\
               -e PRIVATE_KEY="your_private_key" \\
               -e EXECUTOR_MODE="arbitrage" \\
               ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
             \`\`\`

          3. **Environment Variables**:
             - \`RPC_URL\`: Ethereum RPC endpoint (required)
             - \`PRIVATE_KEY\`: Account private key (required)
             - \`EXECUTOR_MODE\`: \`arbitrage\`, \`liquidation\`, or \`both\` (default: \`arbitrage\`)
             - \`FLASH_LOAN_PROVIDER\`: \`aave\`, \`balancer\`, \`uniswap\`, or \`auto\` (default: \`auto\`)

          ### 🔒 Security Note
          These images are built with SBOM and provenance attestations. Verify image signatures using:
          \`\`\`bash
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          \`\`\`

          ### 📝 Full Documentation
          [\${GITHUB_SERVER_URL}/\${GITHUB_REPOSITORY}]
          EOF

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: false
